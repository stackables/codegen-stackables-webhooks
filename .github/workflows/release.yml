name: Release
on:
  push:
    branches:
      - main

# id-token: npm trusts this workflow (trusted publishing), so no npm token is needed. The rest is what
# changesets/action needs to push the version branch, open the "Version Packages" PR and create releases.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          cache: true
          require-lockfile: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Release
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm ci:publish
          create-github-releases: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
